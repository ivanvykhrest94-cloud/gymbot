<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дневник тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#e7e9ec; --card:#ffffff; --card2:#f1f2f4; --line:#d3d7dd;
  --ink:#14161a; --mu:#667085; --btn:#14161a; --btn-ink:#ffffff;
  --blue:#1d57c9; --red:#d42b3d; --yellow:#f2c200; --yellow-ink:#3a2f00;
  --green:#14894a; --grey:#7b8494; --dn:#c2272d;
  --disp:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#111317; --card:#1a1d23; --card2:#23272f; --line:#2c313b;
  --ink:#f1f2f4; --mu:#98a1b0; --btn:#f1f2f4; --btn-ink:#14161a;
  --blue:#5b8cff; --red:#ff5a6a; --yellow:#f6cf2f; --green:#35c071; --grey:#7f8898; --dn:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:800;line-height:.98;letter-spacing:.005em}
h1{font-size:46px;text-transform:uppercase}
h2{font-size:24px;font-weight:700;margin:26px 0 10px}
h3{font-size:24px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mu{color:var(--mu)}
.sm{font-size:13px}

/* карточки и кнопки */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;font-weight:700;font-size:16px;background:var(--btn);color:var(--btn-ink)}
.btn.soft{background:var(--card2);color:var(--ink)}
.btn.dn{background:transparent;color:var(--dn);border:1px solid var(--line)}
.btn.sm{height:42px;border-radius:12px;font-size:14px}
.btn:active,.chk:active,.daycard:active{transform:scale(.985)}
.link{font-weight:600;color:var(--mu);padding:6px 0}
.link.dn{color:var(--dn)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

/* блин */
.plate{--s:62px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--dc);color:var(--dci);display:grid;place-items:center;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.3),inset 0 0 0 6px var(--dc),inset 0 0 0 8px rgba(0,0,0,.2)}
.plate b{font:800 calc(var(--s)*.5)/1 var(--disp);transform:translateY(-1px)}
.plate.big{--s:76px}
.plate.mini{--s:40px}
.plate.mini b{font-size:20px}
.plate.roll{animation:roll .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes roll{from{transform:rotate(-230deg) scale(.55);opacity:0}}
@media (prefers-reduced-motion:reduce){.plate.roll{animation:none}.chk.done{animation:none!important}}

/* главная */
.date{color:var(--mu);font-weight:500;margin-bottom:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.wd i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:block}
.wd.on i{background:var(--dc);border-color:var(--dc)}
.wd.today{color:var(--ink);font-weight:700}
.wd.today i{border-color:var(--ink)}
.wd.on.today i{border-color:var(--dc);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.weeknote{font-size:13px;color:var(--mu);margin-bottom:4px}
.daycard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;transition:transform .12s}
.daycard.next{border:2px solid var(--dc);padding:13px}
.daycard .meta{font-size:13px;color:var(--mu);margin-top:5px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--dc);color:var(--dci);margin-bottom:6px}
.resume{border:2px dashed var(--line);background:transparent}
.empty{text-align:center;color:var(--mu);padding:26px 10px}

/* тренировка */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wkh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.wkh h1{font-size:38px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.ex-h{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.ex-h h3{font-size:23px;line-height:1.02}
.tgt{font-family:var(--disp);font-weight:700;font-size:22px;white-space:nowrap;color:var(--dc)}
.prev{font-size:13px;color:var(--mu);margin-top:8px}
.tip{font-size:13px;font-weight:600;margin-top:3px}
.tip.up{color:var(--green)}
.set{display:grid;grid-template-columns:20px 1fr 12px 1fr 48px;gap:8px;align-items:center;margin-top:9px}
.sn{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--mu);text-align:center}
.x{color:var(--mu);text-align:center}
.in{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);text-align:center;font:700 22px/1 var(--disp);outline:none;padding:0 6px;min-width:0}
.in:focus{border-color:var(--ink)}
.in.t{text-align:left;font:500 16px/1.2 var(--body);padding:0 12px}
.chk{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--mu);display:grid;place-items:center;transition:transform .1s}
.chk .ic{stroke-width:3}
.chk.done{background:var(--green);border-color:var(--green);color:#fff;animation:pop .22s}
@keyframes pop{50%{transform:scale(1.14)}}
.set.done .in{opacity:.6}
.set.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.exf{display:flex;gap:8px;margin-top:12px}
.exf .btn{flex:1}

/* итоги */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile b{display:block;font:800 32px/1 var(--disp);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mu)}
.trend{font-weight:700;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--card2);white-space:nowrap}
.trend.up{background:var(--green);color:#fff}
.trend.dn{color:var(--dn)}
.trend.pr{background:var(--yellow);color:var(--yellow-ink)}

/* прогресс */
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.exrow .v{font-family:var(--disp);font-weight:700;font-size:20px;text-align:right;white-space:nowrap}
.exrow.off{opacity:.5}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.chart text{fill:var(--mu);font:500 10px var(--body)}
.chart .lv{fill:var(--ink);font:700 12px var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .pt{fill:var(--card);stroke-width:2.5}
.sess{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.sess:first-child{border-top:0}
.sess span:first-child{color:var(--mu);white-space:nowrap}
.sess span:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* история */
.hist{width:100%;text-align:left;display:flex;align-items:center;gap:12px}
.hdet{margin-top:12px;padding-top:6px;border-top:1px solid var(--line)}
.hdet .ln{padding:8px 0;border-bottom:1px solid var(--line)}
.hdet .ln b{display:block;font-weight:600}
.hdet .ln span{font-size:13px;color:var(--mu)}

/* программа */
.day .dh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.pex{border-top:1px solid var(--line);padding:12px 0 4px}
.pex .pr{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.pex label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.pex label .in{height:42px;width:58px;font-size:19px}
.dash{padding-bottom:12px;color:var(--mu)}
.ib{width:40px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--mu)}
.ib.dn{color:var(--dn)}
.sp{flex:1}

/* навигация */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line)}
#tabs.hide{display:none}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--mu);border-radius:12px}
#tabs button.on{color:var(--ink)}
#tabs button.on .ic{stroke-width:2.6}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.loading{text-align:center;color:var(--mu);padding:120px 0}
</style>
</head>
<body>
<div id="app"><main id="view"><div class="loading">Загружаю дневник</div></main></div>
<nav id="tabs" class="hide">
  <button data-act="tab" data-t="train"><svg class="ic" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Тренировка</button>
  <button data-act="tab" data-t="progress"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Прогресс</button>
  <button data-act="tab" data-t="history"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>История</button>
  <button data-act="tab" data-t="program"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Программа</button>
</nav>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ───────── настройки ───────── */
const STEP = 2.5; // на сколько кг повышать вес, когда все подходы закрыты

/* ───────── Telegram ───────── */
const tg = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);
const tryDo = f => { try { return f(); } catch (e) { return undefined; } };
const scheme = (tg && tg.colorScheme) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.dataset.theme = scheme;
if (tg) {
  const col = scheme === 'dark' ? '#111317' : '#e7e9ec';
  tryDo(() => tg.ready());
  tryDo(() => tg.expand());
  tryDo(() => tg.setHeaderColor(col));
  tryDo(() => tg.setBackgroundColor(col));
  tryDo(() => tg.setBottomBarColor && tg.setBottomBarColor(scheme === 'dark' ? '#1a1d23' : '#ffffff'));
  tryDo(() => tg.disableVerticalSwipes && tg.disableVerticalSwipes());
}
const haptic = t => tryDo(() => tg.HapticFeedback.impactOccurred(t));

/* ───────── хранилище: облако Telegram, запасной вариант localStorage ───────── */
const CLOUD = IN_TG && !!tg.CloudStorage && (!tg.isVersionAtLeast || tg.isVersionAtLeast('6.9'));
const LS = {
  get: k => { try { return localStorage.getItem('gb_' + k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem('gb_' + k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem('gb_' + k); } catch (e) {} },
  keys: () => { try { return Object.keys(localStorage).filter(k => k.startsWith('gb_')).map(k => k.slice(3)); } catch (e) { return []; } }
};
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const cloud = {
  keys: () => new Promise((ok, no) => tg.CloudStorage.getKeys((e, v) => e ? no(e) : ok(v || []))),
  many: ks => new Promise((ok, no) => ks.length ? tg.CloudStorage.getItems(ks, (e, v) => e ? no(e) : ok(v || {})) : ok({})),
  set: (k, v) => new Promise((ok, no) => tg.CloudStorage.setItem(k, v, (e, r) => e ? no(e) : ok(r))),
  del: ks => new Promise((ok, no) => tg.CloudStorage.removeItems(ks, (e, r) => e ? no(e) : ok(r)))
};
async function loadAll() {
  if (CLOUD) {
    try {
      const keys = await withTimeout(cloud.keys(), 8000);
      const data = {};
      for (let i = 0; i < keys.length; i += 40) Object.assign(data, await withTimeout(cloud.many(keys.slice(i, i + 40)), 8000));
      return data;
    } catch (e) { console.warn('cloud load failed', e); }
  }
  const data = {};
  LS.keys().forEach(k => data[k] = LS.get(k));
  return data;
}
function put(k, v) { LS.set(k, v); if (CLOUD) cloud.set(k, v).catch(e => console.warn('cloud set', k, e)); }
function drop(ks) { ks.forEach(LS.del); if (CLOUD && ks.length) cloud.del(ks).catch(e => console.warn('cloud del', e)); }

/* ───────── утилиты ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fw = n => String(Math.round(n * 100) / 100);
const num = s => { const v = parseFloat(String(s).replace(',', '.')); return isFinite(v) ? v : NaN; };
const e1rm = (w, r) => w * (1 + r / 30);
const uid = () => Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-4);
const jparse = s => { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dShort = iso => new Date(iso).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
const dLong = iso => cap(new Date(iso).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' }));
const dkey = d => d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
const fmtSet = s => s[0] ? fw(s[0]) + '×' + s[1] : s[1] + ' повт';
const fmtSets = a => a.map(fmtSet).join(', ');
const nf = n => Math.round(n).toLocaleString('ru-RU');
const ICON_CHECK = '<svg class="ic" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
const ICON_NEXT = '<svg class="ic" viewBox="0 0 24 24" style="color:var(--mu)"><path d="M9 6l6 6-6 6"/></svg>';
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1900); }
function askConfirm(msg) {
  return new Promise(res => {
    if (IN_TG && tg.showConfirm) { try { tg.showConfirm(msg, ok => res(!!ok)); return; } catch (e) {} }
    res(window.confirm(msg));
  });
}

/* ───────── программа по умолчанию ───────── */
const DEFAULT_DAYS = () => [
  { id: 'A', name: 'Фулбади A', sub: '', exercises: [
    { id: 'a1', name: 'Жим гантелей на наклонной скамье', sets: 3, min: 10, max: 15 },
    { id: 'a2', name: 'Goblet приседания', sets: 3, min: 10, max: 15 },
    { id: 'a3', name: 'Подтягивания', sets: 3, min: 5, max: 8 },
    { id: 'rdl', name: 'Румынская тяга с гантелями', sets: 3, min: 10, max: 15 },
    { id: 'hrow', name: 'Тяга горизонтального блока на вверх спины', sets: 3, min: 10, max: 15 },
    { id: 'lat', name: 'Суперсет из махов гантелей в стороны', sets: 3, min: 10, max: 20 },
    { id: 'a7', name: 'Dead Bug', sets: 3, min: 10, max: 16 },
    { id: 'a8', name: 'Супер сет на руки', sets: 3, min: 8, max: 12 }
  ] },
  { id: 'B', name: 'Фулбади B', sub: 'Акцент на ягодицы', exercises: [
    { id: 'b1', name: 'Жим гантелей на небольшом наклоне', sets: 3, min: 10, max: 15 },
    { id: 'b2', name: 'Приседания на ящик', sets: 3, min: 6, max: 8 },
    { id: 'b3', name: 'Австралийские подтягивания', sets: 3, min: 10, max: 15 },
    { id: 'rdl', name: 'Румынская тяга с гантелями (акцент на ягодицы)', sets: 3, min: 10, max: 15 },
    { id: 'hrow', name: 'Тяга горизонтального блока', sets: 3, min: 10, max: 15 },
    { id: 'lat', name: 'Суперсет: махи гантелей в стороны', sets: 3, min: 10, max: 20 },
    { id: 'b7', name: 'Доп.: отведение бедра в тренажёре (ягодичные)', sets: 3, min: 10, max: 20 }
  ] }
];

/* ───────── состояние ───────── */
let P = { days: [] }, W = [], draft = null;
const state = { tab: 'train', screen: null, exId: null, metric: 'top', openW: null, summary: null, intro: true };
let timerId = null, draftT = null;

function saveDay(d) { put('day_' + d.id, JSON.stringify(d)); }
function saveOrder() { put('dayorder', JSON.stringify(P.days.map(d => d.id))); }
function saveDraftSoon() { clearTimeout(draftT); draftT = setTimeout(() => draft && put('draft', JSON.stringify(draft)), 350); }
function hydrate(data) {
  const order = jparse(data.dayorder);
  const days = [];
  if (Array.isArray(order)) order.forEach(id => { const d = jparse(data['day_' + id]); if (d && d.id && Array.isArray(d.exercises)) days.push(d); });
  if (!Array.isArray(order)) { P.days = DEFAULT_DAYS(); P.days.forEach(saveDay); saveOrder(); } else P.days = days;
  W = Object.keys(data).filter(k => k.startsWith('w_')).map(k => jparse(data[k])).filter(w => w && w.t && w.s).sort((a, b) => a.t < b.t ? -1 : 1);
  draft = jparse(data.draft);
  if (draft && !Array.isArray(draft.ex)) draft = null;
}

/* ───────── данные: подходы, подсказки ───────── */
const DAY_COLORS = ['blue', 'red', 'yellow', 'green', 'grey'];
function dayColor(dayId) { const i = P.days.findIndex(d => d.id === dayId); return DAY_COLORS[i < 0 ? 4 : Math.min(i, 4)]; }
function dcStyle(dayId) { const c = dayColor(dayId); return `--dc:var(--${c});--dci:${c === 'yellow' ? 'var(--yellow-ink)' : '#fff'}`; }
function letter(name) { const w = String(name).trim().split(/\s+/).pop() || '?'; return w.charAt(0).toUpperCase(); }
function plate(dayId, name, cls, extra) { return `<div class="plate ${cls || ''}" style="${dcStyle(dayId)}"><b>${esc(letter(name))}</b></div>`; }

function sessionsFor(exId) { const o = []; W.forEach(w => { const s = w.s[exId]; if (s && s.length) o.push({ w, sets: s }); }); return o; }
function lastSets(exId) { const a = sessionsFor(exId); return a.length ? a[a.length - 1] : null; }
function sstats(sets) {
  return {
    top: Math.max(...sets.map(x => x[0])),
    e: Math.max(...sets.map(x => e1rm(x[0], x[1]))),
    vol: sets.reduce((a, x) => a + x[0] * x[1], 0),
    reps: Math.max(...sets.map(x => x[1]))
  };
}
function suggest(ex, last) {
  if (!last) return { text: 'Первый раз: подбери рабочий вес', up: false, w: null };
  const top = Math.max(...last.sets.map(s => s[0]));
  const atTop = last.sets.filter(s => s[0] === top);
  const full = last.sets.length >= ex.sets && Math.min(...atTop.map(s => s[1])) >= ex.max;
  if (top === 0) return full

function makeRows(e) {
  const last = lastSets(e.id), sg = suggest(e, last), rows = [];
  for (let i = 0; i < e.sets; i++) {
    const prev = last ? (last.sets[i] || last.sets[last.sets.length - 1]) : null;
    let w = '', r = '';
    if (prev) {
      w = sg.up && sg.w ? fw(sg.w) : (prev[0] ? fw(prev[0]) : '');
      r = sg.up ? String(e.min) : String(prev[1]);
    }
    rows.push([w, r, 0]);
  }
  return rows;
}
async function startWorkout(dayId) {
  const day = P.days.find(d => d.id === dayId);
  if (!day) return;
  if (!day.exercises.length) { toast('В этом дне нет упражнений'); return; }
  if (draft && draft.dayId === dayId) { state.screen = 'workout'; render(); return; }
  if (draft && !(await askConfirm('Есть незавершённая тренировка. Начать новую? Старая будет удалена.'))) return;
  draft = { dayId, name: day.name, sub: day.sub || '', t: new Date().toISOString(),
    ex: day.exercises.map(e => ({ i: e.id, n: e.name, s: e.sets, a: e.min, b: e.max, r: makeRows(e) })) };
  put('draft', JSON.stringify(draft));

}
function cleanSets(rows) {
  const out = [];
  rows.forEach(r => {
    if (!r[2]) return;
    const reps = parseInt(r[1], 10), w = r[0] === '' ? 0 : num(r[0]);
    if (reps >= 1 && w >= 0) out.push([w, reps]);
  });
  return out;
}
async function finishWorkout() {

  if (!c.d) { if (await askConfirm('Нет ни одного отмеченного подхода. Выйти без сохранения?')) cancelDraft(); return; }
  if (c.d < c.t && !(await askConfirm(`Отмечено ${c.d} из ${c.t} подходов. Завершить тренировку?`))) return;
  const s = {}, nm = {}, items = [];
  let vol = 0, nsets = 0;
  draft.ex.forEach(e => {
    const sets = cleanSets(e.r);
    if (!sets.length) return;
    const prevAll = sessionsFor(e.i), prev = prevAll[prevAll.length - 1];
    const cur = sstats(sets).e, pe = prev ? sstats(prev.sets).e : null, best = prevAll.length ? Math.max(...prevAll.map(x => sstats(x.sets).e)) : null;
    let mark = 'new';

    items.push({ n: e.n, sets, mark });

function chart(vals, labels, color, fmtV) {
  const n = vals.length, Wd = 340, Ht = 190, L = 36, R = 16, T = 22, B = 26;
  let mn = Math.min(...vals), mx = Math.max(...vals);
  const flat = mn === mx;
  if (flat) { mn -= 1; mx += 1; }
  const pad = (mx - mn) * 0.14, lo0 = Math.min(...vals);
  mn -= pad; mx += pad;
  if (lo0 >= 0 && mn < 0) mn = 0;
  const X = i => n === 1 ? L + (Wd - L - R) / 2 : L + i * (Wd - L - R) / (n - 1);
  const Y = v => T + (1 - (v - mn) / (mx - mn)) * (Ht - T - B);
  const tick = v => (mx - mn) > 8 ? Math.round(v) : Math.round(v * 10) / 10;
  let g = '';
  for (let k = 0; k < 4; k++) { const v = mn + (mx - mn) * k / 3, y = Y(v); g += `<line class="gl" x1="${L}" x2="${Wd - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${L - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${tick(v)}</text>`; }
  const pts = vals.map((v, i) => [X(i), Y(v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = n > 1 ? `<path d="${line} L${pts[n - 1][0].toFixed(1)} ${Ht - B} L${pts[0][0].toFixed(1)} ${Ht - B} Z" fill="${color}" opacity=".12"/>` : '';
  const dots = pts.map((p, i) => `<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === n - 1 ? 5 : 3.5}" stroke="${color}" ${i === n - 1 ? `fill="${color}"` : ''}/>`).join('');
  const lp = pts[n - 1];
  return `<svg class="chart" viewBox="0 0 ${Wd} ${Ht}" width="100%" role="img" aria-label="График прогресса">${g}${area}${n > 1 ? `<path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}${dots}
    <text class="lv" x="${Math.min(lp[0], Wd - R - 8).toFixed(1)}" y="${(lp[1] - 11).toFixed(1)}" text-anchor="middle">${fmtV(vals[n - 1])}</text>
    <text x="${L}" y="${Ht - 6}" text-anchor="${n === 1 ? 'middle' : 'start'}" ${n === 1 ? `transform="translate(${(Wd - L - R) / 2})"` : ''}>${labels[0]}</text>${n > 1 ? `<text x="${Wd - R}" y="${Ht - 6}" text-anchor="end">${labels[n - 1]}</text>` : ''}</svg>`;
}

  if (state.screen === 'workout' && draft) html = vWorkout();
  else if (state.screen === 'summary' && state.summary) html = vSummary();
  else if (state.screen === 'exercise') html = vExercise();
  else { state.screen = null; html = ({ train: vHome, progress: vProgress, history: vHistory, program: vProgram })[state.tab](); }
  v.innerHTML = html;
  const full = state.screen === 'workout' || state.screen === 'summary';
  $('#tabs').classList.toggle('hide', full);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === state.tab && !state.screen));
  window.scrollTo(0, keep ? y : 0);
  if (state.screen === 'workout') timerId = setInterval(() => { const e = $('#elapsed'); if (e && draft) e.textContent = elapsed(); }, 30000);
  if (tg) {
    tryDo(() => (state.screen ? tg.BackButton.show() : tg.BackButton.hide()));
    tryDo(() => (state.screen === 'workout' ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation()));
  }
}
function goBack() {
  if (state.screen === 'summary') state.screen = null;
  else state.screen = null;
  render();
}
if (tg) tryDo(() => tg.BackButton.onClick(goBack));

/* ───────── действия ───────── */
const view = $('#view');
view.addEventListener('input', e => {
  const t = e.target;
  if (!draft || !t.dataset.k) return;
  const sec = t.closest('.ex'), row = t.closest('.set');
  if (!sec || !row) return;
  draft.ex[+sec.dataset.i].r[+row.dataset.j][t.dataset.k === 'w' ? 0 : 1] = t.value;
  saveDraftSoon();
});
view.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f;
  if (!f) return;
  const dayEl = t.closest('.day'); if (!dayEl) return;
  const day = P.days.find(d => d.id === dayEl.dataset.d); if (!day) return;
  if (f === 'dname') day.name = t.value.trim().slice(0, 40) || day.name;
  else if (f === 'dsub') day.sub = t.value.trim().slice(0, 60);
  else {
    const ex = day.exercises.find(x => x.id === t.closest('.pex').dataset.e); if (!ex) return;
    if (f === 'ename') ex.name = t.value.trim().slice(0, 80) || ex.name;
    else {
      const n = parseInt(t.value, 10);
      if (f === 'esets') ex.sets = n >= 1 && n <= 10 ? n : ex.sets;
      if (f === 'emin') ex.min = n >= 1 && n <= 200 ? n : ex.min;
      if (f === 'emax') ex.max = n >= 1 && n <= 200 ? n : ex.max;
      if (ex.min > ex.max) [ex.min, ex.max] = [ex.max, ex.min];
    }
  }
  saveDay(day);
  render(true);
});
function programAct(act, b) {
  const dayEl = b.closest('.day'), day = dayEl && P.days.find(d => d.id === dayEl.dataset.d);
  const exEl = b.closest('.pex'), idx = exEl && day ? day.exercises.findIndex(x => x.id === exEl.dataset.e) : -1;
  if (act === 'eup' && idx > 0) { const a = day.exercises; [a[idx - 1], a[idx]] = [a[idx], a[idx - 1]]; saveDay(day); render(true); }
  else if (act === 'edown' && idx >= 0 && idx < day.exercises.length - 1) { const a = day.exercises; [a[idx + 1], a[idx]] = [a[idx], a[idx + 1]]; saveDay(day); render(true); }
  else if (act === 'edel' && idx >= 0) { askConfirm('Убрать «' + day.exercises[idx].name + '» из программы? История останется.').then(ok => { if (ok) { day.exercises.splice(idx, 1); saveDay(day); render(true); } }); }
  else if (act === 'addex' && day) {
    day.exercises.push({ id: uid(), name: 'Новое упражнение', sets: 3, min: 8, max: 12 }); saveDay(day); render(true);
    const ins = document.querySelectorAll(`.day[data-d="${CSS.escape(day.id)}"] .pex [data-f="ename"]`); const last = ins[ins.length - 1];
    if (last) { last.scrollIntoView({ block: 'center' }); last.focus(); last.select(); }
  }
  else if (act === 'delday' && day) { askConfirm('Удалить день «' + day.name + '»? История тренировок останется.').then(ok => { if (ok) { P.days = P.days.filter(d => d.id !== day.id); drop(['day_' + day.id]); saveOrder(); render(true); } }); }
  else if (act === 'addday') { const d = { id: uid(), name: 'Новый день', sub: '', exercises: [] }; P.days.push(d); saveDay(d); saveOrder(); render(true); const ins = document.querySelectorAll('[data-f="dname"]'); const l = ins[ins.length - 1]; if (l) { l.scrollIntoView({ block: 'center' }); l.focus(); l.select(); } }
  else if (act === 'reset') {
    askConfirm('Заменить программу на Фулбади A и B? Свои правки в программе пропадут, история останется.').then(ok => {
      if (!ok) return;
      const defs = DEFAULT_DAYS(), keep = new Set(defs.map(d => d.id));
      drop(P.days.filter(d => !keep.has(d.id)).map(d => 'day_' + d.id));
      P.days = defs; defs.forEach(saveDay); saveOrder(); render(true); toast('Программа восстановлена');
    });
  }
}
view.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case 'start': startWorkout(b.dataset.d); break;
    case 'resume': state.screen = 'workout'; render(); break;
    case 'minimize': state.screen = null; render(); break;
    case 'cancel': if (await askConfirm('Отменить тренировку? Введённые подходы пропадут.')) cancelDraft(); break;
    case 'chk': {
      const sec = b.closest('.ex'), row = b.closest('.set'), r = draft.ex[+sec.dataset.i].r[+row.dataset.j];
      if (!r[2]) {
        const reps = parseInt(r[1], 10), w = r[0] === '' ? 0 : num(r[0]);
        if (!(w >= 0)) { toast('Проверь вес'); row.classList.add('bad'); setTimeout(() => row.classList.remove('bad'), 350); return; }
        if (!(reps >= 1)) { toast('Введи повторы'); row.classList.add('bad'); setTimeout(() => row.classList.remove('bad'), 350); return; }
        r[2] = 1; haptic('light');
      } else r[2] = 0;
      b.classList.toggle('done', !!r[2]); row.classList.toggle('done', !!r[2]);
      updateProgress(); saveDraftSoon(); break;
    }
    case 'addset': {
      const ex = draft.ex[+b.closest('.ex').dataset.i], l = ex.r[ex.r.length - 1];
      if (ex.r.length >= 12) { toast('Максимум 12 подходов'); break; }
      ex.r.push(l ? [l[0], l[1], 0] : ['', '', 0]); saveDraftSoon(); render(true); break;
    }
    case 'delset': {
      const ex = draft.ex[+b.closest('.ex').dataset.i];
      if (ex.r.length > 1) { ex.r.pop(); saveDraftSoon(); render(true); }
      break;
    }
    case 'finish': finishWorkout(); break;
    case 'sumdone': state.screen = null; state.tab = 'train'; state.summary = null; render(); break;
    case 'ex': state.exId = b.dataset.e; { const st = sessionsFor(state.exId).map(s => sstats(s.sets)); state.metric = Math.max(...st.map(s => s.top)) > 0 ? 'top' : 'reps'; } state.screen = 'exercise'; render(); break;
    case 'back': state.screen = null; render(); break;
    case 'metric': state.metric = b.dataset.m; render(true); break;
    case 'hopen': state.openW = state.openW === b.dataset.w ? null : b.dataset.w; render(true); break;
    case 'hdel':
      if (await askConfirm('Удалить эту тренировку из истории?')) { drop(['w_' + b.dataset.w]); W = W.filter(w => w.id !== b.dataset.w); state.openW = null; render(true); }
      break;
    default: programAct(act, b);
  }
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-act="tab"]'); if (!b) return;
  state.tab = b.dataset.t; state.screen = null; render();
});

/* ───────── запуск ───────── */
loadAll().then(data => { hydrate(data); render(); }).catch(err => {
  console.error(err);
  $('#view').innerHTML = '<div class="empty">Не удалось загрузить данные.<br>Закрой приложение и открой снова.</div>';
});
})();
</script>
</body>
